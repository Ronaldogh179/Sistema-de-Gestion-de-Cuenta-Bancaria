services:
  app:
    image: node:22-bookworm
    working_dir: /workspace
    command: sleep infinity
    volumes:
      - .:/workspace:cached
    ports:
      - "3001:3001"
      - "5173:5173"
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_datos:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-init:
    image: mongo:8.0
    entrypoint: ["bash", "/opt/init-replica.sh"]
    volumes:
      - ./scripts/init-replica.sh:/opt/init-replica.sh:ro
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_datos:
